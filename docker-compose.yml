services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Secrets arrive at runtime from .env; they are never copied into the image.
    env_file: .env
    # Host port is overridable if 8000 is busy: BACKEND_PORT=8001 docker compose up --build
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # The SQLite file lives on the host, so history survives container restarts.
    volumes:
      - ./data_warehouse:/app/data_warehouse
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    environment:
      # Inside the Compose network the backend is reachable by its service name.
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
